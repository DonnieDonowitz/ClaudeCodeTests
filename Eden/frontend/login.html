<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eden – Login / Registrati</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --teal: #3EC9C0; --teal-dark: #29A89F; --dark: #0A1628; --dark2: #141e33; --white: #F5F9F8; --muted: #8aa4b4; --danger: #E23D28; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .login-card { width: 100%; max-width: 420px; background: var(--dark2); border: 1px solid rgba(62,201,192,0.25); border-radius: 20px; padding: 36px; margin: 20px; }
    .logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
    .logo-icon { width: 48px; height: 48px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .logo-text { font-size: 1.4rem; font-weight: 700; }
    .logo-text span { display: block; font-size: 0.7rem; color: var(--teal); font-weight: 400; }
    
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    
    .tabs { display: flex; background: var(--dark); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 12px; border: none; background: transparent; color: var(--muted); border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.2s; }
    .tab.active { background: var(--teal); color: var(--dark); }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--teal); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(62,201,192,0.3); background: var(--dark); color: var(--white); font-size: 1rem; }
    .form-input:focus { outline: none; border-color: var(--teal); }
    
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-size: 1rem; font-weight: 700; }
    .btn-primary { background: var(--teal); color: var(--dark); margin-top: 8px; }
    .btn-primary:hover { background: var(--teal-dark); }
    
    .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(62,201,192,0.2); }
    .divider span { font-size: 0.8rem; color: var(--muted); }
    
    .social-btns { display: flex; gap: 12px; }
    .btn-social { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(62,201,192,0.3); background: transparent; color: var(--white); cursor: pointer; font-size: 0.9rem; }
    .btn-social:hover { background: rgba(62,201,192,0.1); }
    
    .error { background: rgba(226,61,40,0.15); color: #FF7060; padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .error.show { display: block; }
    
    .links { text-align: center; margin-top: 24px; font-size: 0.85rem; }
    .links a { color: var(--teal); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    .back-link a:hover { color: var(--teal); }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 80 80" width="36" height="36">
        <circle cx="40" cy="40" r="40" fill="white"/>
        <path d="M40 15 C40 15 22 34 22 46 C22 56 30 64 40 64 C50 64 58 56 58 46 C58 34 40 15 40 15Z" fill="#3EC9C0" opacity="0.85"/>
        <circle cx="40" cy="28" r="7" fill="#29A89F"/>
      </svg>
    </div>
    <div class="logo-text">Eden Fitness</div>
  </div>
  
  <h1>Benvenuto</h1>
  <p class="subtitle">Accedi o registrati per continuare</p>
  
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Accedi</button>
    <button class="tab" onclick="switchTab('register')">Registrati</button>
  </div>
  
  <div id="error" class="error"></div>
  
  <!-- Login Form -->
  <div id="form-login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" class="form-input" placeholder="email@esempio.it">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" class="form-input" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="login()">Accedi</button>
  </div>
  
  <!-- Register Form -->
  <div id="form-register" style="display:none;">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="regName" class="form-input" placeholder="Il tuo nome">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" class="form-input" placeholder="email@esempio.it">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPass" class="form-input" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="register()">Registrati</button>
  </div>
  
  <div class="divider"><span>oppure</span></div>
  
  <div class="social-btns">
    <button class="btn-social" onclick="socialLogin('google')">G Google</button>
    <button class="btn-social" onclick="socialLogin('facebook')">f Facebook</button>
  </div>
  
  <div class="links">
    <a href="#">Password dimenticata?</a> · <a href="#">Servizi</a>
  </div>
  
  <div class="back-link">
    <a href="index.html">← Torna al sito</a>
  </div>
</div>

<script>
const API = '/api';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab:${tab === 'login' ? 'first' : 'last'}-child`).classList.add('active');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('error').classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!email || !password) return showError('Compila tutti i campi');
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Login fallito');
    }
    const data = await res.json();
    localStorage.setItem('eden_token', data.token);
    location.href = data.user.role === 'admin' ? '/admin.html' : '/user.html';
  } catch(e) { showError(e.message); }
}

async function register() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPass').value;
  if (!name || !email || !password) return showError('Compila tutti i campi');
  try {
    const res = await fetch(API + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Registrazione fallita');
    }
    const data = await res.json();
    localStorage.setItem('eden_token', data.token);
    location.href = '/user.html';
  } catch(e) { showError(e.message); }
}

function socialLogin(provider) {
  showError('Login sociale non ancora implementato');
}
</script>
</body>
</html>
