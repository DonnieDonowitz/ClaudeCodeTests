<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eden – Area Utente</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --teal: #3EC9C0; --teal-dark: #29A89F; --dark: #0A1628; --dark2: #141e33; --white: #F5F9F8; --muted: #8aa4b4; --danger: #E23D28; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; }
    
    header { background: var(--dark2); border-bottom: 1px solid rgba(62,201,192,0.25); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--dark); }
    .logo-text { font-weight: 700; font-size: 1.2rem; color: var(--white); }
    .logo-text span { display: block; font-size: 0.7rem; color: var(--teal); font-weight: 400; }
    nav.header-nav { display: flex; gap: 12px; }
    nav.header-nav a { color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; transition: all 0.2s; }
    nav.header-nav a:hover, nav.header-nav a.active { color: var(--white); background: rgba(62,201,192,0.15); }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 36px; height: 36px; background: var(--teal); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--dark); font-size: 0.85rem; }
    .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .btn-logout:hover { background: var(--danger); color: white; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .page { display: none; }
    .page.active { display: block; }
    h2 { font-size: 1.4rem; margin: 0 0 20px; }

    .card { background: var(--dark2); border: 1px solid rgba(62,201,192,0.2); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; margin-bottom: 16px; }

    .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .plan-card { background: var(--dark); border: 1px solid rgba(62,201,192,0.2); border-radius: 14px; padding: 20px; }
    .plan-card.featured { border-color: var(--teal); }
    .plan-name { color: var(--teal); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .plan-price { font-size: 2rem; font-weight: 700; }
    .plan-price span { font-size: 1rem; }
    .plan-desc { font-size: 0.85rem; color: var(--muted); margin: 8px 0 16px; }
    .plan-features { list-style: none; margin-bottom: 16px; }
    .plan-features li { font-size: 0.85rem; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .plan-features li::before { content: '✓'; color: var(--teal); }

    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-primary { background: var(--teal); color: var(--dark); }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-secondary { background: transparent; border: 1px solid var(--teal); color: var(--teal); }
    .btn-paypal { background: #003087; color: white; }
    .btn-stripe { background: #635BFF; color: white; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(62,201,192,0.15); }
    th { font-size: 0.75rem; color: var(--teal); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; background: rgba(62,201,192,0.08); }
    .btn-enroll { padding: 6px 12px; background: rgba(62,201,192,0.2); color: var(--teal); border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    .closures-list { list-style: none; }
    .closures-list li { padding: 10px 14px; background: rgba(226,61,40,0.15); border-radius: 8px; margin-bottom: 8px; color: #FF7060; }

    .toast { position: fixed; top: 20px; right: 20px; background: var(--teal); color: var(--dark); padding: 14px 24px; border-radius: 10px; font-weight: 600; transform: translateY(-100px); transition: transform 0.3s; z-index: 1000; }
    .toast.show { transform: translateY(0); }

    @media (max-width: 768px) { header { flex-direction: column; gap: 12px; } .btn-row { flex-direction: column; } }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="logo-icon">E</div>
    <div class="logo-text">Eden<span>Area Utente</span></div>
  </a>
  <nav class="header-nav">
    <a href="#plans" class="active" onclick="showPage('plans')">Abbonamenti</a>
    <a href="#courses" onclick="showPage('courses')">Corsi</a>
    <a href="#closures" onclick="showPage('closures')">Chiusure</a>
  </nav>
  <div class="user-info">
    <div class="user-avatar" id="userAvatar">U</div>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>
</header>

<main class="container">

<!-- Plans Page -->
<div id="page-plans" class="page active">
  <h2>I tuoi abbonamenti</h2>
  <div class="card">
    <div class="plans-grid" id="plansGrid"></div>
    <div class="btn-row" style="margin-top: 20px;">
      <button class="btn btn-paypal" onclick="pay('paypal')">Paga con PayPal</button>
      <button class="btn btn-stripe" onclick="pay('stripe')">Paga con Stripe</button>
    </div>
  </div>
</div>

<!-- Courses Page -->
<div id="page-courses" class="page">
  <h2>Iscriviti ai corsi</h2>
  <div class="card">
    <table id="coursesTable">
      <thead><tr><th>Corso</th><th>Categoria</th><th>Orario</th><th>Iscriviti</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Closures Page -->
<div id="page-closures" class="page">
  <h2>Giorni di chiusura</h2>
  <div class="card">
    <p style="color: var(--muted); margin-bottom: 16px;">I seguenti giorni la Palestra è chiusa:</p>
    <ul class="closures-list" id="closuresList"></ul>
  </div>
</div>

</main>

<div class="toast" id="toast">Azione completata!</div>

<script>
const API = '/api';
let token = localStorage.getItem('eden_token');

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) throw new Error('Errore');
  return res.json();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.header-nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector(`a[href="#${page}"]`).classList.add('active');
}

async function init() {
  if (!token) { location.href = '/login.html'; return; }
  try {
    const user = JSON.parse(atob(token.split('.')[1]));
    document.getElementById('userAvatar').textContent = user.name?.[0] || 'U';
  } catch { logout(); }
  await loadPlans();
  await loadCourses();
  await loadClosures();
}

async function loadPlans() {
  try {
    const plans = await api('/plans');
    const grid = document.getElementById('plansGrid');
    grid.innerHTML = plans.map(p => `
      <div class="plan-card ${p.id === 2 ? 'featured' : ''}">
        <div class="plan-name">${p.name}</div>
        <div class="plan-price">€<span>${p.mensile}</span><small>/mese</small></div>
        <div class="plan-desc">€${p.annule}/mese annuale</div>
        <ul class="plan-features">
          <li>Accesso ${p.name}</li>
        </ul>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

async function pay(method) {
  try {
    const res = await api('/' + method, { method: 'POST', body: JSON.stringify({ amount: 1, planId: 1 }) });
    showToast('Pagamento simulato effettuato con ' + method.toUpperCase());
  } catch(e) { showToast(e.message); }
}

async function loadCourses() {
  try {
    const courses = await api('/courses');
    const tbody = document.querySelector('#coursesTable tbody');
    tbody.innerHTML = courses.map(c => `
      <tr>
        <td>${c.name}</td>
        <td>${c.category}</td>
        <td>${c.time}</td>
        <td><button class="btn-enroll" onclick="enrollCourse(${c.id})">Iscriviti</button></td>
      </tr>
    `).join('');
  } catch(e) { console.error(e); }
}

async function enrollCourse(courseId) {
  try {
    await api('/user/courses/enroll', { method: 'POST', body: JSON.stringify({ course_id: courseId }) });
    showToast('Iscritto al corso!');
  } catch(e) { showToast(e.message); }
}

async function loadClosures() {
  try {
    const year = new Date().getFullYear();
    const closures = await api('/closures?year=' + year);
    const list = document.getElementById('closuresList');
    list.innerHTML = closures.length 
      ? closures.map(c => `<li>${new Date(c.date).toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</li>`).join('')
      : '<li style="color: var(--teal); background: rgba(62,201,192,0.15);">Nessuna chiusura programmata</li>';
  } catch(e) { console.error(e); }
}

function logout() {
  localStorage.removeItem('eden_token');
  location.href = '/login.html';
}

init();
</script>
</body>
</html>
